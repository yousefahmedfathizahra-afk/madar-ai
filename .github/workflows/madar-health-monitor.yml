name: MADAR AI health monitor

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: madar-ai-health-monitor
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check home, API health, and real chat
        id: probe
        continue-on-error: true
        env:
          MADAR_BASE_URL: https://madar-ai-yousef.vercel.app
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import sys
          import time
          import urllib.request

          base = os.environ["MADAR_BASE_URL"].rstrip("/")
          findings = []
          failure = None
          def fetch(path, payload=None, timeout=15):
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              headers = {"User-Agent": "MADAR-AI-Health-Monitor/1.0", "Cache-Control": "no-cache"}
              if body is not None:
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(base + path, data=body, headers=headers, method="POST" if body is not None else "GET")
              begin = time.monotonic()
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  content = response.read(250000)
                  status = response.status
              return status, content, time.monotonic() - begin

          def check():
              status, body, elapsed = fetch("/", timeout=12)
              if status != 200 or b"madarWelcomeChoice" not in body or b"madarBuddy" not in body:
                  raise RuntimeError("Homepage returned an unexpected response")
              findings.append("Homepage: OK (" + str(round(elapsed, 2)) + "s)")

              status, body, elapsed = fetch("/api/health", timeout=10)
              if status != 200:
                  raise RuntimeError("Health endpoint returned HTTP " + str(status))
              health = json.loads(body.decode("utf-8"))
              if health.get("ok") is not True or health.get("configured") is not True:
                  raise RuntimeError("Health endpoint is not ready or AI backend is not configured")
              findings.append("API health: OK (" + str(round(elapsed, 2)) + "s)")

              # Alternate tiers on successive half-hour windows; each tier is tested hourly.
              slot = int(time.time() // 1800)
              tier = "pro" if slot % 2 else "free"
              request_body = {
                  "mode": "chat",
                  "tier": tier,
                  "messages": [{"role": "user", "content": "اشرح في جملة واحدة لماذا نرى القمر ليلاً."}]
              }
              last_error = None
              for attempt in range(2):
                  try:
                      status, body, elapsed = fetch("/api/chat", request_body, timeout=22)
                      result = json.loads(body.decode("utf-8"))
                      if status != 200 or result.get("tier") != tier or not isinstance(result.get("reply"), str) or not result["reply"].strip():
                          raise RuntimeError("Chat returned an empty reply or the wrong tier")
                      findings.append("Real " + tier.upper() + " chat: OK (" + str(round(elapsed, 2)) + "s)")
                      if elapsed > 3:
                          findings.append("Note: chat exceeded the 3-second performance target")
                      if elapsed > 12:
                          raise RuntimeError("Chat latency was over 12 seconds (" + str(round(elapsed, 2)) + "s)")
                      return
                  except Exception as exc:
                      last_error = type(exc).__name__ + ": " + str(exc)[:180]
                      if attempt == 0:
                          time.sleep(2)
              raise RuntimeError("Real " + tier.upper() + " chat failed twice: " + str(last_error))

          try:
              check()
          except Exception as exc:
              failure = type(exc).__name__ + ": " + str(exc)[:300]
              findings.append("INCIDENT: " + failure)

          now = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
          report = "MADAR AI monitor at " + now + "\n" + "\n".join(findings) + "\n"
          print(report)
          with open("madar-monitor-result.txt", "w", encoding="utf-8") as f:
              f.write(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## MADAR health check\n\n" + "\n\n".join(findings) + "\n")
          if failure:
              sys.exit(1)
          PY

      - name: Automatically report a persistent incident
        if: steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="MADAR AI automated incident"
          existing="$(gh issue list --repo "$GH_REPO" --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          {
            echo "The automatic health check detected a persistent problem."
            echo
            cat madar-monitor-result.txt
            echo
            echo "See the failed GitHub Actions run for more details."
            echo "No credentials, conversations, or private user information are logged."
          } > madar-issue-body.txt
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GH_REPO" --body-file madar-issue-body.txt
          else
            gh issue create --repo "$GH_REPO" --title "$title" --body-file madar-issue-body.txt --assignee "${{ github.repository_owner }}" ||
              gh issue create --repo "$GH_REPO" --title "$title" --body-file madar-issue-body.txt
          fi
          exit 1

      - name: Automatically close a resolved incident
        if: steps.probe.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="MADAR AI automated incident"
          existing="$(gh issue list --repo "$GH_REPO" --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GH_REPO" --body "MADAR has recovered: homepage, health endpoint and a real chat test passed."
            gh issue close "$existing" --repo "$GH_REPO" --reason completed
          fi
